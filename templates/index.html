<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Debugger</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background-color: #f4f6f9; }
        .sidebar {
            width: 250px; height: 100vh;
            position: fixed; left: 0; top: 0;
            background: #111; padding: 20px; color: white;
        }
        .sidebar a { color: #bbb; display: block; margin: 10px 0; text-decoration: none; }
        .sidebar a:hover { color: white; }
        .main-content { margin-left: 270px; padding: 25px; }

        .output-box {
            white-space: pre-wrap;
            background: white;
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            border: 1px solid #ccc;
        }

        body.dark-mode { background: #121212; color: white; }
        body.dark-mode .output-box { background: #1e1e1e; color: white; border-color: #444; }
        body.dark-mode .sidebar { background: #000; }
    </style>
</head>

<body>

    <div class="sidebar">
        <h4><i class="bi bi-bug-fill"></i> AI Debugger</h4>
        <a href="/debugger">Debugger</a>
        <a href="/languages">Languages</a>
        <a href="/reports">Reports</a>
        <a href="/documentation">Documentation</a>
        <a href="/about">About</a>
    </div>

    <div class="main-content">

        <button id="darkToggle" class="btn btn-dark float-end">🌙 Dark Mode</button>

        <h2><i class="bi bi-pencil-square"></i> Write Your Code</h2>

        <label>Select Language:</label>
        <select id="language" class="form-select w-25">
            <option>Python</option>
            <option>C</option>
            <option>Java</option>
            <option>JavaScript</option>
        </select>

        <textarea id="codeInput" class="form-control mt-3" rows="8" placeholder="Write code here..."></textarea>

        <button id="analyzeBtn" class="btn btn-primary w-100 mt-3">Analyze Code</button>
        <button id="autofixBtn" class="btn btn-warning w-100 mt-3 d-none">Auto Fix</button>
        <button id="pdfBtn" class="btn btn-success w-100 mt-3 d-none">Download PDF</button>

        <h3 class="mt-4">Analysis Output</h3>
        <div id="output" class="output-box">Output will appear here...</div>

    </div>

    <script src="/static/js/script.js"></script>

</body>
</html>
