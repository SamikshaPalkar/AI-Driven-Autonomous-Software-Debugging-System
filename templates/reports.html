<!DOCTYPE html>
<html>
<head>
    <title>Reports</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

<h2>Saved Reports</h2>
<p>Click on a report to view or download.</p>

<ul>
    {% for r in reports %}

    {% endfor %}
</ul>

</body>
</html>
